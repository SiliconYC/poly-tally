name: Collect and publish Pages

on:
  push:
    branches: [dev]
  schedule:
    # UTC 01:17 / 13:17 = 上海时间 09:17 / 21:17。
    - cron: '17 1,13 * * *'
  workflow_dispatch:

concurrency:
  group: poly-tally-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify collector and dashboard
        run: |
          python -m pytest -q
          node --test web/*.test.mjs
      - name: Restore optional object and parser caches
        uses: actions/cache@v4
        with:
          path: .poly-tally
          key: tally-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tally-v1-${{ runner.os }}-
      - name: Restore durable public checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/state.mjs restore .poly-tally/remote-checkpoint.json
      - name: Collect public repositories
        env:
          POLY_TALLY_TOKEN: ${{ github.token }}
        run: |
          restore=()
          if [ -f .poly-tally/remote-checkpoint.json ]; then
            restore=(--import-checkpoint .poly-tally/remote-checkpoint.json --authoritative-checkpoint)
            cp .poly-tally/remote-checkpoint.json .poly-tally/checkpoint.json
          fi
          python -m poly_tally collect --public-only --refresh --allow-partial --checkpoint .poly-tally/checkpoint.json "${restore[@]}"
          node scripts/build-site.mjs
      - name: Stage durable checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: public-checkpoint
          path: .poly-tally/checkpoint.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  persist:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: public-checkpoint
          path: checkpoint
      - name: Save durable public state when inventory changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/state.mjs save checkpoint/checkpoint.json

  deploy:
    needs: [collect, persist]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
