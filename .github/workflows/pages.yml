name: Collect and publish Pages

on:
  push:
    branches: [dev]
  schedule:
    # UTC 07:00 / 15:00 / 23:00 = 台北时间 15:00 / 23:00 / 次日 07:00（UTC+8）。
    - cron: '0 7,15,23 * * *'
  workflow_dispatch:
    inputs:
      external_private_blob_sha:
        description: 'Explicit sanitized tally-state/private-metrics.json Git blob SHA for this publication (40 lowercase hex)'
        required: false
        type: string

concurrency:
  group: poly-tally-publish
  cancel-in-progress: false

permissions:
  contents: read

# 统计批次只隔离派生状态；公开原始对象和解析事实可跨批次复用。
env:
  POLY_TALLY_DATASET_EPOCH: source-only-no-eigen-2026-10-22-v1

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      private_available: ${{ steps.private-state.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify collector and dashboard
        run: |
          npm run typecheck
          npm test
          python -m pytest -q
          node --test scripts/*.test.mjs web/*.test.mjs
      - name: Verify production dashboard in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Restore optional public object and parser caches
        uses: actions/cache@v4
        with:
          path: |
            .poly-tally/cache/public
            .poly-tally/epochs/${{ env.POLY_TALLY_DATASET_EPOCH }}
          key: tally-public-native-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tally-public-native-v2-${{ runner.os }}-
      - name: Restore only current-epoch public checkpoint and sanitized private baseline
        id: restore-state
        env:
          GH_TOKEN: ${{ github.token }}
          POLY_TALLY_EXTERNAL_PRIVATE_BLOB_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.external_private_blob_sha || '' }}
        run: node scripts/state.mjs restore .poly-tally/remote-checkpoint.json web/data/private-metrics.json
      - name: Collect public repositories from the current default branches
        env:
          RESET_REQUIRED: ${{ steps.restore-state.outputs.reset-required }}
          POLY_TALLY_TOKEN: ${{ github.token }}
        run: |
          restore=()
          partial=(--allow-partial)
          state=.poly-tally
          if [ "$RESET_REQUIRED" = 'true' ]; then
            # 只丢弃派生统计，继续复用已授权公开对象和事实。
            state="$RUNNER_TEMP/public-reset"
            partial=()
          fi
          if [ "$RESET_REQUIRED" != 'true' ] && [ -f .poly-tally/remote-checkpoint.json ]; then
            restore=(--import-checkpoint .poly-tally/remote-checkpoint.json --authoritative-checkpoint)
            cp .poly-tally/remote-checkpoint.json .poly-tally/checkpoint.json
          fi
          python -m poly_tally collect --public-only --refresh --state "$state" --cache .poly-tally/cache "${partial[@]}" --checkpoint .poly-tally/checkpoint.json "${restore[@]}"
      - name: Build dashboard with current-epoch metrics; leave incomplete rebuild visibly pending
        env:
          POLY_TALLY_REQUIRE_PRIVATE: 'true'
          POLY_TALLY_EXTERNAL_PRIVATE_BLOB_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.external_private_blob_sha || '' }}
          PRIVATE_SCAN_STATUS: not-configured
        run: POLY_TALLY_PRIVATE_STATUS="$(node scripts/metrics.mjs status)" node scripts/build-site.mjs
      - name: Detect sanitized state for durable publication
        id: private-state
        run: |
          if [ -f web/data/private-metrics.json ]; then
            node scripts/metrics.mjs validate web/data/private-metrics.json --complete
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage durable public checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: public-checkpoint
          path: .poly-tally/checkpoint.json
          retention-days: 90
          if-no-files-found: error
      - name: Stage durable sanitized private metrics
        if: steps.private-state.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-metrics
          path: web/data/private-metrics.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  persist:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: public-checkpoint
          path: checkpoint
      - name: Download sanitized private state when available
        if: needs.collect.outputs.private_available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: private-metrics
          path: checkpoint
      - name: Save durable state when inventory or sanitized metrics change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=()
          if [ -f checkpoint/private-metrics.json ]; then
            private=(checkpoint/private-metrics.json)
          fi
          node scripts/state.mjs save checkpoint/checkpoint.json "${private[@]}"

  deploy:
    needs: [collect, persist]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.persist.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
